# 이 파일은 예시입니다. 실제 비밀번호와 키를 넣어 GitHub에 업로드하지 마세요.
# 실제 값은 Streamlit 앱 설정의 Secrets에만 입력하세요.
[app]
allowed_emails = ["YOUR_EMAIL@gmail.com", "FAMILY_EMAIL@gmail.com"]
spreadsheet_id = "GOOGLE_SPREADSHEET_ID"

[gcp_service_account]
type = "service_account"
project_id = "YOUR_PROJECT_ID"
private_key_id = "YOUR_PRIVATE_KEY_ID"
private_key = "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
client_email = "YOUR_SERVICE_ACCOUNT@YOUR_PROJECT.iam.gserviceaccount.com"
client_id = "YOUR_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "YOUR_CLIENT_CERT_URL"

[google_login]
client_id = "YOUR_OAUTH_CLIENT_ID.apps.googleusercontent.com"
